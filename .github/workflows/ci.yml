name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Report Swift toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build and test
        run: ./scripts/test.sh
