name: Alpha prerelease

on:
  push:
    tags:
      - "v*-alpha*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify release identity
        run: test "$GITHUB_REF_NAME" = "v$(tr -d '[:space:]' < VERSION)"
      - name: Test and package
        run: ./scripts/release-alpha.sh
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/release/*.zip dist/release/*.sha256
          --verify-tag --prerelease
          --title "LocalStat $GITHUB_REF_NAME"
          --notes-file docs/RELEASE_NOTES_0.1.0-alpha.md
